#Tooltips
Tooltips:
  General Settings:
    Preferred API Backend: Choose the backend that Fjernsyn uses to obtain data. The
      local API is a built-in extractor. The Invidious API requires an Invidious server
      to connect to.
    Fallback to Non-Preferred Backend on Failure: When your preferred API has a problem,
      Fjernsyn will automatically attempt to use your non-preferred API as a fallback
      method when enabled.
    Thumbnail Preference: All thumbnails throughout Fjernsyn will be replaced with
      a frame of the video, blurred or hidden instead of the default thumbnail.
    Invidious Instance: The Invidious instance that Fjernsyn will connect to for API
      calls. Changes to this setting apply only to the current window unless you set this instance as the default.
    Region for Explore: Which country's charts Explore shows. Trending is per country,
      so this decides what is on the page.
    External Link Handling: |
      Choose the default behavior when a link, which cannot be opened in Fjernsyn, is clicked.
      By default Fjernsyn will open the clicked link in your default browser.
    Open Deep Links In New Window: URLs passed to Fjernsyn, such as by redirect
      browser extensions or command line arguments, are opened in a new window.
    Handle FreeTube Links: Opens freetube:// links, which official FreeTube and the
      browser redirect extensions use, as well as Fjernsyn's own fjernsyn:// links.
      Official FreeTube takes these links back each time it starts, and so does Fjernsyn
      while this is on. On Linux, turning it off only stops Fjernsyn taking them back.
  Player Settings:
    Proxy Videos Through Invidious: Will connect to Invidious to serve videos instead
      of making a direct connection to YouTube.
    Default Video Format: Set the formats used when a video plays. DASH formats can
      play higher qualities. Legacy formats are limited to a max of 360p but use less
      bandwidth. Audio formats are audio only streams.
    Scroll Playback Rate Over Video Player: While the cursor is over the video, press and
      hold the Control key (Command Key on Mac) and scroll the mouse wheel forwards or backwards to control
      the playback rate. Press and hold the Control key (Command Key on Mac) and left click the mouse
      to quickly return to the default playback rate (1x unless it has been changed in the settings).
    Skip by Scrolling Over Video Player: Use the scroll wheel to skip through the video, MPV style.
    Normalize Loudness: Correct each video's volume for how loud it was mastered, so that
      quiet videos are boosted to match everything else. This works both ways, so videos
      that were mastered loudly will play quieter than they do now. Only available with
      the local API, as Invidious does not report how loud a video is.
    Show Most Replayed Heatmap: While the player controls show, show a curve above the
      seek bar of which parts of the video viewers replay the most, for videos YouTube
      has one for.
  External Player Settings:
    External Player: Choosing an external player will display an icon, for opening the
      video (playlist if supported) in the external player, on the thumbnail. Warning, Invidious settings do not affect external players.
    Custom External Player Executable: By default, Fjernsyn will assume that the chosen external
      player can be found via the PATH environment variable. If needed, a custom path can
      be set here.
    Ignore Warnings: Suppress warnings for when the current external player does not support
      the current action (e.g. reversing playlists, etc.).
    Ignore Default Arguments: Do not send any default arguments to the external player
      aside from the video URL (e.g. playback rate, playlist URL, etc.).
      Custom arguments will still be passed on.
    Custom External Player Arguments: Any custom command line arguments you want to be passed on to the external player.
    DefaultCustomArgumentsTemplate: "(Default: '{defaultCustomArguments}')"
  yt-dlp Settings:
    Enable Download Button: Shows a button on the watch page that hands the video to yt-dlp,
      which downloads it with its own defaults. Not offered for upcoming videos or live broadcasts.
    Custom Arguments: Command line arguments passed to yt-dlp for every download, with each option and each value as its own entry,
      for instance a format, an output template, subtitles or cookies. They come after
      Fjernsyn's own, so they can override them.
  Distraction Free Settings:
    Hide Channels: Enter a channel ID to hide all videos, playlists and the channel itself from appearing in search, trending, most popular and recommended.
       The channel ID entered must be a complete match and is case sensitive.
    Hide Videos, Playlists and Channels Containing Text: Enter a word, word fragment, or phrase (case insensitive) to hide all videos, playlists and channels whose original titles contain it throughout all of Fjernsyn, excluding only History, Your Playlists, and videos inside of playlists.
    Hide Videos on Watch: 'Hides watched videos on the Subscriptions and Explore pages. The Watched chip on either page switches this too.'
    Hide AI Videos: 'Hides videos made with AI from search, subscriptions, channel pages and the videos beside the one playing. Only videos whose creator told YouTube so, and videos from channels marked as AI, are known to be. The AI chip on each of those pages switches this too.'
    Channels Marked as AI: 'Every video from a channel marked as AI carries the AI marker, and is hidden with the others. Mark a channel from the menu on any of its videos, or enter its ID here. Removing a channel here is the way to unmark one whose videos are hidden.'
  Subscription Settings:
    Fetch Feeds from RSS: When enabled, Fjernsyn will use RSS instead of its default
      method for grabbing your subscription feed. RSS is faster and prevents IP blocking,
      but doesn't provide certain information like video duration, live status or posts
    Fetch Automatically: When enabled, Fjernsyn will automatically fetch
      your subscription feed on startup and when a new window is opened.
    Fill In Missing Video Details: When your feed comes from RSS it has no video
      durations. With this enabled, Fjernsyn quietly fetches the missing details
      for the part of the feed you are looking at, one channel at a time, and
      fills them in as they arrive. Results are kept, so each channel is only
      fetched once.
    Recover Failed Refreshes: 'When a refresh cannot reach some of your channels,
      Fjernsyn goes back for them in the background: first a profile at a time,
      then one channel at a time, asking for less at once with each attempt. The
      feed stays usable throughout and fills in as they arrive.'
  Experimental Settings:
    Replace HTTP Cache: Disables Electron's disk based HTTP cache and enables a custom in-memory image cache. Will lead to increased RAM usage.
    Disable Hardware Acceleration: Disables GPU hardware acceleration. May fix graphical issues, but will probably perform worse.
    Regulated Streaming: 'When YouTube stops trusting a playback session, Fjernsyn
      recovers it in the background rather than interrupting you. This enables the
      more eager version of that, which may keep a spare session ready so a recovery
      costs you nothing at all. Currently identical to the standard behaviour;
      the difference arrives with the session pool. Takes effect on the next video.'
  SponsorBlock Settings:
    UseDeArrowTitles: Replace video titles with user-submitted titles from DeArrow.
    UseDeArrowThumbnails: Replace video thumbnails with thumbnails from DeArrow.

