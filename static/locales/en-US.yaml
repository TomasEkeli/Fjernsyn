# Global
# Anything shared among components / views should be put here
Global:
  Videos: Videos
  Shorts: Shorts
  Live: Live
  Posts: Posts
  Sort By: Sort By
  # The marker a card carries when it is not a plain video. One card, one item,
  # so these are singular, unlike the plural names of the feeds above.
  Kind Marker:
    Short: Short
    Live: Live
    Upcoming: Upcoming
    Post: Post
    # The last four mark what a post carries, on top of the post marker itself
    Poll: Poll
    Quiz: Quiz
    Video: Video
    Playlist: Playlist
    # A video made with AI: YouTube's "Made with AI" label, or a channel the
    # user marked as AI. Beside the kind marker, not instead of it
    AI: AI
  # When something is scheduled for, as the stated time with how far off it is
  # beside it: "09-12 12:00 (in 6 days)". The stated time is never dropped —
  # "in 6 days" is not something anyone can write in a calendar, and it stops
  # being true the moment it is read.
  Scheduled Time: '{absolute} ({relative})'
  Counts:
    Video Count: 1 video | {count} videos
    Channel Count: 1 channel | {count} channels
    Subscriber Count: 1 subscriber | {count} subscribers
    View Count: 1 view | {count} views
    Like Count: 1 like | {count} likes
    Comment Count: 1 comment | {count} comments
    Watching Count: 1 watching | {count} watching
    Replies Remaining: "{' '}(1 remaining) | {' '}({count} remaining)"

