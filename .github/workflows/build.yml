# Builds Fjernsyn for every platform, and releases every push to main.
#
# The version is major.minor from package.json and the run number as the
# patch: 0.1.214, 0.1.215, ... The run number only ever rises, so every
# release is newer than the last, and skipped numbers (a run that failed, or
# one of another branch) are fine. A minor or major step is made by hand, in
# package.json; its patch there is ignored. Nothing is committed back: the
# patch lives only in the release's tag.
#
# A build of another branch, run by hand (Run workflow), is named for its
# branch and released nowhere.

name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.github/**/*.md'
      - '.github/workflows/autoMerge.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/compress-images.yml'
      - '.github/workflows/conflicts.yml'
      - '.github/workflows/label-issue.yml'
      - '.github/workflows/label-pr.yml'
      - '.github/workflows/no-response.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/remove-outdated-labels.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/updateSite.yml'

  workflow_dispatch:

cache-mode: none
permissions: {}

jobs:
  version:
    name: Version

    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        persist-credentials: false

    - name: Set version number
      id: version
      shell: bash
      run: |
        major_minor="$(jq -r '.version' package.json | cut -d. -f1,2)"
        version="${major_minor}.${GITHUB_RUN_NUMBER}"
        release_tag=''

        if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == 'refs/heads/main' ]]; then
          release_tag="v${version}"
        else
          # Slashes become dashes, as they cannot go in a file name
          branch="$(echo -E "$GITHUB_REF_NAME" | tr '/' '-' | tr -cd '[:alnum:]._-')"
          version="${version}-${branch}"
        fi

        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Build

    needs: version

    cache-mode: write

    permissions:
      actions: write
      contents: read

    strategy:
      matrix:
        node-version: [24.x]
        runtime:
          - linux-x64
          - linux-armv7l
          - linux-arm64
          - win-x64
          - win-arm64
          - osx-x64
          - osx-arm64
        include:
        - runtime: linux-x64
          os: ubuntu-latest

        - runtime: linux-armv7l
          os: ubuntu-latest

        - runtime: linux-arm64
          os: ubuntu-latest

        - runtime: osx-x64
          os: macOS-latest

        - runtime: osx-arm64
          os: macOS-latest

        - runtime: win-x64
          os: windows-latest

        - runtime: win-arm64
          os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 #v6.1.0
      with:
        version: 11
        cache: false

    - name: Get pnpm cache directory
      id: cache_dir
      shell: bash
      run: |
        {
          echo 'cache_dir<<EOF'
          pnpm store path
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: Restore pnpm cache
      id: restore_cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
      with:
        key: ${{ format('node-cache-{0}-{1}-pnpm-{2}', runner.os, runner.arch, hashFiles('pnpm-lock.yaml')) }}
        path: ${{ steps.cache_dir.outputs.cache_dir }}

    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm run lint
      shell: bash
    # Once is enough: the tests do not depend on the platform built for
    - run: pnpm test
      if: matrix.runtime == 'linux-x64'
      shell: bash
    - name: Set version number
      id: versionNumber
      shell: bash
      env:
        VERSION: ${{ needs.version.outputs.version }}
        RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      run: |
        package_json="$(jq --arg version "$VERSION" '.version = $version' package.json)"

        echo -E "$package_json" > package.json
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

        # Baked into the app, which links its version to the release page
        # when there is one
        echo "FJERNSYN_RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

    - name: Install libarchive-tools
      if: startsWith(matrix.os, 'ubuntu')
      shell: bash
      run: |
        sudo apt update
        sudo apt -y install libarchive-tools

    - name: Build x64 with Node.js ${{ matrix.node-version}}
      if: contains(matrix.runtime, 'x64')
      shell: bash
      run: pnpm run build

    - name: Build ARMv7l with Node.js ${{ matrix.node-version}}
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      shell: bash
      run: pnpm run build:arm32

    - name: Build ARM64 with Node.js ${{ matrix.node-version}}
      if: contains(matrix.runtime, 'arm64')
      shell: bash
      run: pnpm run build:arm64

    - name: Upload Linux .zip x64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-linux-x64-portable.zip
        path: build/fjernsyn-${{ steps.versionNumber.outputs.version }}.zip

    - name: Upload Linux .7z x64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-linux-x64-portable.7z
        path: build/fjernsyn-${{ steps.versionNumber.outputs.version }}.7z

    - name: Upload Linux .zip ARMv7l Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-linux-armv7l-portable.zip
        path: build/fjernsyn-${{ steps.versionNumber.outputs.version }}-armv7l.zip

    - name: Upload Linux .7z ARMv7l Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-linux-armv7l-portable.7z
        path: build/fjernsyn-${{ steps.versionNumber.outputs.version }}-armv7l.7z

    - name: Upload Linux .zip ARM64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-linux-arm64-portable.zip
        path: build/fjernsyn-${{ steps.versionNumber.outputs.version }}-arm64.zip

    - name: Upload Linux .7z ARM64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-linux-arm64-portable.7z
        path: build/fjernsyn-${{ steps.versionNumber.outputs.version }}-arm64.7z

    - name: Upload .deb x64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      with:
        name: fjernsyn_${{ steps.versionNumber.outputs.version }}_amd64.deb
        path: build/fjernsyn_${{ steps.versionNumber.outputs.version }}_amd64.deb

    - name: Upload .deb ARMv7l Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      with:
        name: fjernsyn_${{ steps.versionNumber.outputs.version }}_armv7l.deb
        path: build/fjernsyn_${{ steps.versionNumber.outputs.version }}_armv7l.deb

    - name: Upload .deb ARM64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      with:
        name: fjernsyn_${{ steps.versionNumber.outputs.version }}_arm64.deb
        path: build/fjernsyn_${{ steps.versionNumber.outputs.version }}_arm64.deb

    - name: Upload AppImage x64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-amd64.AppImage
        path: build/Fjernsyn-${{ steps.versionNumber.outputs.version }}.AppImage

    - name: Upload AppImage ARMv7l Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-armv7l.AppImage
        path: build/Fjernsyn-${{ steps.versionNumber.outputs.version }}-armv7l.AppImage

    - name: Upload AppImage ARM64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-arm64.AppImage
        path: build/Fjernsyn-${{ steps.versionNumber.outputs.version }}-arm64.AppImage

    - name: Upload .rpm x64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}.amd64.rpm
        path: build/fjernsyn-${{ steps.versionNumber.outputs.version }}.x86_64.rpm

    # rpm are not built for armv7l

    - name: Upload .rpm ARM64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}.arm64.rpm
        path: build/fjernsyn-${{ steps.versionNumber.outputs.version }}.aarch64.rpm

    - name: Upload Pacman .pacman x64 Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-amd64.pacman
        path: build/fjernsyn-${{ steps.versionNumber.outputs.version }}.pacman

    - name: Upload Windows x64 .exe Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-x64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-setup-x64.exe
        path: build/Fjernsyn Setup ${{ steps.versionNumber.outputs.version }}.exe

    - name: Upload Windows x64 Portable Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-x64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-win-x64-portable.exe
        path: build/Fjernsyn ${{ steps.versionNumber.outputs.version }}.exe

    - name: Upload Windows x64 .zip Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-x64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-win-x64-portable.zip
        path: build/Fjernsyn-${{ steps.versionNumber.outputs.version }}-win.zip

    - name: Upload Windows x64 .7z Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-x64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-win-x64-portable.7z
        path: build/Fjernsyn-${{ steps.versionNumber.outputs.version }}-win.7z

    - name: Upload Windows arm64 .exe Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-arm64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-setup-arm64.exe
        path: build/Fjernsyn Setup ${{ steps.versionNumber.outputs.version }}.exe

    - name: Upload Windows arm64 Portable Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-arm64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-win-arm64-portable.exe
        path: build/Fjernsyn ${{ steps.versionNumber.outputs.version }}.exe

    - name: Upload Windows arm64 .zip Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-arm64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-win-arm64-portable.zip
        path: build/Fjernsyn-${{ steps.versionNumber.outputs.version }}-arm64-win.zip

    - name: Upload Windows arm64 .7z Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-arm64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-win-arm64-portable.7z
        path: build/Fjernsyn-${{ steps.versionNumber.outputs.version }}-arm64-win.7z

    - name: Upload Mac x64 .dmg Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-x64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-mac-x64.dmg
        path: build/Fjernsyn-${{ steps.versionNumber.outputs.version }}.dmg

    - name: Upload Mac x64 .zip Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-x64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-mac-x64.zip
        path: build/Fjernsyn-${{ steps.versionNumber.outputs.version }}-mac.zip

    - name: Upload Mac x64 .7z Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-x64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-mac-x64.7z
        path: build/Fjernsyn-${{ steps.versionNumber.outputs.version }}-mac.7z

    - name: Upload Mac arm64 .dmg Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-arm64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-mac-arm64.dmg
        path: build/Fjernsyn-${{ steps.versionNumber.outputs.version }}-arm64.dmg

    - name: Upload Mac arm64 .zip Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-arm64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-mac-arm64.zip
        path: build/Fjernsyn-${{ steps.versionNumber.outputs.version }}-arm64-mac.zip

    - name: Upload Mac arm64 .7z Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-arm64')
      with:
        name: fjernsyn-${{ steps.versionNumber.outputs.version }}-mac-arm64.7z
        path: build/Fjernsyn-${{ steps.versionNumber.outputs.version }}-arm64-mac.7z

    - name: Save pnpm cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
      # Only save the cache if we weren't able to restore an existing one above
      if: steps.restore_cache.outputs.cache-primary-key != steps.restore_cache.outputs.cache-matched-key
      with:
        key: ${{ steps.restore_cache.outputs.cache-primary-key }}
        path: ${{ steps.cache_dir.outputs.cache_dir }}

  # Only once every platform has built, so a release is never missing one
  release:
    name: Release

    needs: [version, build]
    if: needs.version.outputs.release_tag != ''

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    # All history and tags, for the notes to find the previous release
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Download the builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        path: artifacts

    # Each artefact is a folder holding one file, under the name the file
    # should have in the release; the file itself has electron-builder's name,
    # which for the Windows installers is the same on x64 and arm64
    - name: Name the files for the release
      shell: bash
      run: |
        mkdir release
        for folder in artifacts/*/; do
          name="$(basename "$folder")"
          files=("$folder"*)
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "Expected one file in $folder, found ${#files[@]}" >&2
            exit 1
          fi
          mv "${files[0]}" "release/$name"
        done
        ls -l release

    - name: Write the release notes
      shell: bash
      env:
        RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      run: |
        # The newest release reachable from this commit; upstream's tags
        # (v0.23.4-beta and the like) are never on the fork, and the pattern
        # would not take them anyway
        previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' HEAD 2> /dev/null || true)"
        node _scripts/releaseNotes.mjs "$previous_tag" "$RELEASE_TAG" "$GITHUB_SHA" > notes.md
        cat notes.md

    # A rerun finds the release already made, and replaces its files
    - name: Publish the release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      run: |
        if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fjernsyn $RELEASE_TAG" \
            --notes-file notes.md
        fi
